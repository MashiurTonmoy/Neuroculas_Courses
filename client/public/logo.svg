<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="neuroculasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container Badge -->
  <rect width="64" height="64" rx="16" fill="url(#neuroculasGrad)" />
  
  <!-- Subtle Inner Border Glow -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#93C5FD" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Open Book Logo Icon (AutoStories Symbol) -->
  <g transform="translate(12, 14)" fill="#FFFFFF" filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M 2,6 C 2,4.8 2.9,3.8 4.1,3.6 C 9.2,2.8 15.5,4.5 19,7 L 19,30 C 15.5,27.8 9.2,26.2 4.1,27 C 2.9,27.2 2,28.2 2,29.4 L 2,6 Z" />
    <!-- Right Page -->
    <path d="M 38,6 C 38,4.8 37.1,3.8 35.9,3.6 C 30.8,2.8 24.5,4.5 21,7 L 21,30 C 24.5,27.8 30.8,26.2 35.9,27 C 37.1,27.2 38,28.2 38,29.4 L 38,6 Z" />
    <!-- Center Spine Divider -->
    <rect x="19" y="5" width="2" height="25" rx="1" fill="#E0F2FE" />
  </g>
</svg>
